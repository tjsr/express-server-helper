name: Build project
on: [push]
permissions:
  contents: read
  packages: read
jobs:
  build:
    name: Node ${{ matrix.node }} (${{ matrix.support }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
          cache: npm
      - name: Use latest npm
        run: npm install --global npm@latest --registry=https://registry.npmjs.org
      - run: node --version && npm --version
      - run: npm ci --strict-peer-deps
      - name: Verify the Express 5 dependency chain
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createRequire } = require('node:module');
          const path = require('node:path');
          const semver = require('semver');
          assert.equal(require('express/package.json').version, '5.3.0');
          assert.equal(require('@types/express/package.json').version, '5.0.6');
          const middlewareEntry = require.resolve('@tjsr/user-session-middleware');
          const middleware = require(path.resolve(path.dirname(middlewareEntry), '../../package.json'));
          const middlewareRequire = createRequire(middlewareEntry);
          assert.equal(middleware.version, '0.2.0');
          assert.ok(semver.satisfies(middlewareRequire('express/package.json').version, middleware.peerDependencies.express));
          const mysqlEntry = middlewareRequire.resolve('@tjsr/mysql-pool-utils');
          const mysql = require(path.resolve(path.dirname(mysqlEntry), '../../package.json'));
          assert.equal(mysql.version, '0.2.2');
          assert.ok(semver.satisfies(createRequire(mysqlEntry)('mysql2/package.json').version, mysql.dependencies.mysql2));
          NODE
      - run: npm test
      - run: npm run build
      - name: Validate package
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
        run: |
          npm run prepublishOnly --if-present
          npm pack --dry-run
