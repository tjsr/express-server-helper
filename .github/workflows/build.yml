name: Build project
on: [push]
permissions:
  contents: read
  packages: read
jobs:
  build:
    name: Node ${{ matrix.node }} (${{ matrix.support }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
          cache: npm
      - name: Use latest npm
        run: npm install --global npm@latest --registry=https://registry.npmjs.org
      - run: node --version && npm --version
      - name: Inspect published Express middleware compatibility
        if: matrix.node == 24
        run: |
          npm view @tjsr/user-session-middleware versions dist-tags peerDependencies --json
          npm view '@tjsr/user-session-middleware@*' version peerDependencies --json
          npm view @tjsr/mysql-pool-utils versions dist-tags exports --json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate package
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
        run: |
          npm run prepublishOnly --if-present
          npm pack --dry-run
